<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>불꽃 피구왕</title>
<style>
html,body{margin:0;height:100%;background:#0d0d14;overflow:hidden;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
canvas{display:block;margin:0 auto;background:#000}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=960,H=540;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.style.marginTop=((innerHeight-H*s)/2)+'px';}
addEventListener('resize',fit);fit();

// ---------- 상수 ----------
const CL=60,CR=900,CT=112,CB=500,MID=480;
const CATCHW=0.3,FIRE_T=0.75;
const TEAM_NAME=['블루 피닉스','레드 타이푼'];
const TEAM_COL=['#3a7bea','#e04646'],TEAM_DARK=['#1f4fa8','#9c2626'];
const NAMES=[['한결','도윤','서준','하람'],['카이','레오','진','바론']];
const HAIR=[['#2a1a10','#5b3a1e','#111','#7a4b22'],['#111','#d9a441','#3b2b55','#222']];
const DIFFS=[
 {name:'쉬움',catchN:.18,catchF:.03,react:.45,hold:[1.3,2.3],fire:.15,speed:150,aim:.28},
 {name:'보통',catchN:.33,catchF:.08,react:.28,hold:[.9,1.7],fire:.3,speed:175,aim:.14},
 {name:'어려움',catchN:.5,catchF:.17,react:.15,hold:[.55,1.1],fire:.45,speed:200,aim:.06}];
let diffIdx=1,diff=DIFFS[1];

// ---------- 입력 ----------
const keys={},pressed={},released={};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(!keys[k])pressed[k]=true;keys[k]=true;
 if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();initAudio();});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys[k]=false;released[k]=true;});
const K=(...ks)=>ks.some(k=>keys[k]),P=(...ks)=>ks.some(k=>pressed[k]),R=(...ks)=>ks.some(k=>released[k]);

// ---------- 사운드 ----------
let AC=null;
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}}
function beep(f,d,type='square',vol=.06,slide=0){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);}
function noise(d,vol=.15){if(!AC)return;const b=AC.createBuffer(1,AC.sampleRate*d|0,AC.sampleRate),a=b.getChannelData(0);
 for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=AC.createBufferSource();s.buffer=b;const g=AC.createGain();g.gain.value=vol;s.connect(g).connect(AC.destination);s.start();}

// ---------- 유틸 ----------
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d;};

// ---------- 상태 ----------
let state='title',T=0,players=[],ball,controlled=null,gauge=[0,0],parts=[],texts=[],shake=0,banner=null,readyT=0,overT=0,winner=-1,slow=0,stats;

function makePlayer(t,i){
 const x=t===0?CL+80+(i%2)*140:CR-80-(i%2)*140,y=CT+55+i*93;
 const hp=i===0?120:100;
 return {team:t,idx:i,name:NAMES[t][i],hair:HAIR[t][i],x,y,vx:0,vy:0,kx:0,ky:0,hp,maxHp:hp,alive:true,fade:1,
  face:t===0?0:Math.PI,catchT:0,catchCd:0,stun:0,inv:0,charge:0,charging:false,fireReady:false,holdT:0,holdLimit:null,plan:null,
  aiT:Math.random(),tx:x,ty:y,willCatch:false,react:.3,throwAnim:0,aim:null,catchAnim:0};
}
function startGame(){
 diff=DIFFS[diffIdx];players=[];
 for(let t=0;t<2;t++)for(let i=0;i<4;i++)players.push(makePlayer(t,i));
 gauge=[0,0];parts=[];texts=[];banner=null;winner=-1;slow=0;
 stats={hits:[0,0],catches:[0,0],fires:[0,0],time:0};
 ball={state:'held',owner:null,x:0,y:0,vx:0,vy:0,team:0,kind:'normal',dmg:0,r:9,t:0,target:null,trail:[],spin:0};
 giveBall(players[0]);controlled=players[0];
 state='ready';readyT=1.8;showBanner('준비~','#fff',1);
}

// ---------- 공 ----------
function giveBall(p){
 ball.state='held';ball.owner=p;ball.trail=[];
 p.holdT=0;p.holdLimit=null;p.plan=null;p.charging=false;p.charge=0;p.fireReady=false;
 for(const q of players)q.willCatch=false;
}
function throwBall(p,tgt,kind){
 const sp={normal:640,fire:900,super:720,pass:540}[kind];
 let ax=tgt.x,ay=tgt.y;
 if(kind!=='pass'){const tt=dist(p,tgt)/sp;ax+=tgt.vx*tt*.5;ay+=tgt.vy*tt*.5;
  if(p.team===1)ay+=(Math.random()*2-1)*diff.aim*220;}
 const a=Math.atan2(ay-p.y,ax-p.x);
 Object.assign(ball,{state:'fly',owner:null,thrower:p,team:p.team,kind,target:tgt,t:0,trail:[],
  x:p.x+Math.cos(a)*18,y:p.y-6+Math.sin(a)*18,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
  dmg:{normal:22,fire:40,super:75,pass:0}[kind],r:kind==='super'?15:9});
 p.face=a;p.holdT=0;p.throwAnim=.25;p.charging=false;p.charge=0;p.fireReady=false;
 if(kind==='pass'){beep(500,.08,'triangle');return;}
 // 상대 AI 반응 결정
 for(const q of players){if(q.team===p.team||!q.alive)continue;
  let ch=kind==='fire'?diff.catchF:diff.catchN;if(q.team===0)ch*=.6;if(kind==='super')ch=0;
  q.willCatch=Math.random()<ch;q.react=(q.team===1?diff.react:.3)+rand(0,.15);}
 if(kind==='normal'){beep(300,.12,'square',.05,300);}
 else if(kind==='fire'){stats.fires[p.team]++;showBanner('불꽃 슛!!','#ff8a1f',.9);noise(.4,.12);beep(160,.4,'sawtooth',.07,500);shake=Math.max(shake,4);}
 else {showBanner('필살! 태양 슛!!!','#ffd23f',1.3);slow=.5;noise(.8,.18);beep(90,.9,'sawtooth',.09,700);shake=10;}
}
function tryCatch(p){
 if(ball.kind==='super')return false;
 if(p===controlled){
  if(p.catchT>0){if(ball.kind==='fire'&&p.catchT<CATCHW-.14){addText(p.x,p.y-50,'타이밍 실패!','#ffb347',16);return false;}return true;}
  return false;}
 return p.willCatch&&p.stun<=0;
}
function catchBall(p){
 giveBall(p);p.catchAnim=.35;stats.catches[p.team]++;
 gauge[p.team]=Math.min(100,gauge[p.team]+(ball.kind==='fire'?35:22));
 addText(p.x,p.y-52,ball.kind==='fire'?'불꽃 캐치!!':'나이스 캐치!','#7fffd4',ball.kind==='fire'?22:18);
 burst(p.x,p.y-8,'#ffffff',14,180);beep(880,.08,'square',.06);setTimeout(()=>beep(1320,.1,'square',.05),70);
 if(ball.kind==='fire'){shake=6;p.kx=Math.cos(Math.atan2(ball.vy,ball.vx))*220;p.ky=0;}
}
function hitPlayer(p){
 p.hp-=ball.dmg;p.stun=ball.kind==='normal'?.45:.7;p.inv=.6;
 const a=Math.atan2(ball.vy,ball.vx),kb={normal:260,fire:420,super:600}[ball.kind];
 p.kx=Math.cos(a)*kb;p.ky=Math.sin(a)*kb;
 stats.hits[ball.team]++;
 gauge[ball.team]=Math.min(100,gauge[ball.team]+15);gauge[p.team]=Math.min(100,gauge[p.team]+10);
 shake=Math.max(shake,{normal:5,fire:11,super:20}[ball.kind]);
 burst(p.x,p.y-8,ball.kind==='normal'?'#fff3b0':'#ff7a1a',ball.kind==='super'?50:ball.kind==='fire'?30:14,ball.kind==='super'?400:260);
 addText(p.x,p.y-48,'-'+ball.dmg,ball.kind==='normal'?'#fff':'#ff9d3c',ball.kind==='normal'?18:26);
 noise(.15,.2);beep(140,.18,'square',.07,-80);
 if(p.hp<=0){p.hp=0;p.alive=false;addText(p.x,p.y-72,'아웃!','#ff4d4d',28);beep(220,.5,'sawtooth',.06,-180);slow=Math.max(slow,.35);}
 ball.state='loose';ball.vx=-ball.vx*.22+rand(-60,60);ball.vy=rand(-160,160);ball.trail=[];
}

// ---------- 이펙트 ----------
function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*sp;
 parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.3,.7),max:.7,col,size:rand(2,5)});}}
function flame(x,y,big){parts.push({x:x+rand(-4,4)*(big?2:1),y:y+rand(-4,4)*(big?2:1),vx:rand(-30,30),vy:rand(-80,-20),
 life:rand(.2,.45)*(big?1.6:1),max:.45*(big?1.6:1),col:Math.random()<.5?'#ff6a00':(Math.random()<.5?'#ffd23f':'#ff2d00'),size:rand(3,7)*(big?1.8:1),fire:true});}
function addText(x,y,txt,col,size){texts.push({x,y,txt,col,size,life:1});}
function showBanner(txt,col,t){banner={txt,col,t,max:t};}

// ---------- 플레이어 로직 ----------
function enemiesOf(p){return players.filter(q=>q.alive&&q.team!==p.team);}
function matesOf(p){return players.filter(q=>q.alive&&q.team===p.team&&q!==p);}
function nearest(list,pt){let b=null,bd=1e9;for(const q of list){const d=dist(q,pt);if(d<bd){bd=d;b=q;}}return b;}
function pickAim(p){
 const dirX=p.team===0?1:-1;
 const aimAng=Math.atan2(Math.sin(p.face),(Math.abs(Math.cos(p.face))+.35)*dirX);
 let best=null,bs=1e9;
 for(const e of enemiesOf(p)){const a=Math.atan2(e.y-p.y,e.x-p.x);const s=Math.abs(angDiff(a,aimAng))+dist(p,e)*.0006;if(s<bs){bs=s;best=e;}}
 return best;
}
function chooseTarget(p){
 const en=enemiesOf(p);if(!en.length)return null;
 if(Math.random()<.5)return en.reduce((a,b)=>a.hp<b.hp?a:b);
 if(Math.random()<.5)return nearest(en,p);
 return en[Math.random()*en.length|0];
}
function pickControlled(){
 const mine=players.filter(p=>p.team===0&&p.alive);if(!mine.length)return null;
 if(ball.state==='held'&&ball.owner.team===0)return ball.owner;
 if(ball.state==='fly'&&ball.target&&ball.target.alive&&ball.target.team===0)return ball.target;
 if(ball.state==='loose'&&ball.x<MID)return nearest(mine,ball);
 return controlled&&controlled.alive?controlled:nearest(mine,ball);
}
function bounds(p){
 const minX=p.team===0?CL+14:MID+14,maxX=p.team===0?MID-14:CR-14;
 p.x=clamp(p.x,minX,maxX);p.y=clamp(p.y,CT+18,CB-8);
}
function humanUpdate(p,dt){
 let ix=(K('arrowright','d')?1:0)-(K('arrowleft','a')?1:0),iy=(K('arrowdown','s')?1:0)-(K('arrowup','w')?1:0);
 if(p.stun>0){ix=iy=0;}
 const l=Math.hypot(ix,iy);if(l){ix/=l;iy/=l;p.face=Math.atan2(iy,ix);}
 const sp=210*(p.charging?.5:1);p.vx=ix*sp;p.vy=iy*sp;p.x+=p.vx*dt;p.y+=p.vy*dt;
 const has=ball.state==='held'&&ball.owner===p;
 if(has){
  p.holdT+=dt;p.aim=pickAim(p);if(!p.aim)return;
  if(P('j',' ')&&p.stun<=0){p.charging=true;p.charge=0;p.fireReady=false;}
  if(p.charging){p.charge+=dt;if(p.charge>=FIRE_T&&!p.fireReady){p.fireReady=true;beep(660,.15,'sawtooth',.05,400);}
   if(p.fireReady&&Math.random()<.7)flame(p.x+rand(-14,14),p.y+rand(-20,10));}
  if(p.charging&&R('j',' ')){throwBall(p,p.aim,p.charge>=FIRE_T?'fire':'normal');}
  else if(P('l')&&gauge[0]>=100){gauge[0]=0;stats.fires[0]++;throwBall(p,p.aim,'super');}
  else if(P('k')&&!p.charging){const m=matesOf(p);if(m.length){const tg=m.reduce((a,b)=>Math.abs(a.x-MID)<Math.abs(b.x-MID)?a:b);throwBall(p,tg,'pass');}}
  else if(p.holdT>6){throwBall(p,p.aim,p.charge>=FIRE_T?'fire':'normal');addText(p.x,p.y-50,'시간 초과!','#ffb347',16);}
 }else{
  p.charging=false;
  if(P('k','j',' ')&&p.catchCd<=0){p.catchT=CATCHW;p.catchCd=.5;p.catchAnim=CATCHW;beep(420,.05,'triangle',.04);}
 }
}
function aiUpdate(p,dt){
 const sp=p.team===1?diff.speed:165;
 let tx=p.tx,ty=p.ty,urgent=false;
 const onMine=x=>p.team===0?x<MID:x>=MID;
 if(ball.state==='held'&&ball.owner===p){
  // 공을 가진 AI (레드팀)
  if(p.holdLimit==null)p.holdLimit=rand(...diff.hold);
  p.holdT+=dt;
  const tgt0=p.plan?p.plan.tgt:pickAim(p);
  tx=p.team===1?MID+75:MID-75;ty=tgt0?clamp(p.y+(tgt0.y-p.y)*.4,CT+20,CB-10):p.y;
  if(!p.plan&&p.holdT>p.holdLimit){
   const tgt=chooseTarget(p);if(!tgt)return;
   const m=matesOf(p),fwd=m.length?m.reduce((a,b)=>Math.abs(a.x-MID)<Math.abs(b.x-MID)?a:b):null;
   if(gauge[p.team]>=100)p.plan={kind:'super',tgt};
   else if(fwd&&Math.abs(fwd.x-MID)+60<Math.abs(p.x-MID)&&Math.random()<.25)p.plan={kind:'pass',tgt:fwd};
   else if(Math.random()<diff.fire){p.plan={kind:'fire',tgt};p.charging=true;p.charge=0;}
   else p.plan={kind:'normal',tgt};
  }
  if(p.plan){
   let ok=true;
   if(p.plan.kind==='fire'){p.charge+=dt;if(Math.random()<.7)flame(p.x+rand(-14,14),p.y+rand(-20,10));if(p.charge<.85)ok=false;}
   if(ok){if(!p.plan.tgt.alive)p.plan.tgt=p.plan.kind==='pass'?(matesOf(p)[0]||chooseTarget(p)):chooseTarget(p);
    if(!p.plan.tgt)return;
    const k=p.plan.kind;if(k==='super')gauge[p.team]=0;throwBall(p,p.plan.tgt,k);p.plan=null;p.holdLimit=null;return;}
  }
 }else if(ball.state==='loose'&&onMine(ball.x)&&p.team===1&&nearest(players.filter(q=>q.alive&&q.team===1&&q.stun<=0),ball)===p){
  tx=ball.x;ty=ball.y;urgent=true;
 }else if(ball.state==='fly'&&ball.team!==p.team&&ball.kind!=='pass'){
  const s=Math.hypot(ball.vx,ball.vy),rx=p.x-ball.x,ry=p.y-ball.y;
  const along=(rx*ball.vx+ry*ball.vy)/s,perp=(rx*-ball.vy+ry*ball.vx)/s;
  if(p.willCatch){tx=p.x;ty=p.y;p.face=Math.atan2(-ball.vy,-ball.vx);}
  else if(along>-10&&Math.abs(perp)<48&&ball.t>p.react){
   const sg=perp>=0?1:-1;tx=p.x+(-ball.vy/s)*sg*80;ty=p.y+(ball.vx/s)*sg*80;urgent=true;
   if(ty<CT+25||ty>CB-15){ty=p.y-(ball.vx/s)*sg*80;tx=p.x-(-ball.vy/s)*sg*80;}
  }
 }else if(ball.state==='fly'&&ball.kind==='pass'&&ball.target===p){tx=p.x;ty=p.y;}
 else{
  p.aiT-=dt;
  if(p.aiT<=0){p.aiT=rand(.8,2);
   const back=p.team===1;const x0=back?MID+90:CL+40,x1=back?CR-40:MID-90;
   p.tx=rand(x0,x1);p.ty=rand(CT+30,CB-20);}
  tx=p.tx;ty=p.ty;
 }
 if(p.stun>0){p.vx=p.vy=0;return;}
 const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);
 const s2=(urgent?sp*1.15:sp*.6)*(p.charging?.4:1);
 if(d>4){p.vx=dx/d*s2;p.vy=dy/d*s2;p.x+=p.vx*dt;p.y+=p.vy*dt;if(!(ball.state==='held'&&ball.owner===p)&&!p.willCatch)p.face=Math.atan2(dy,dx);}
 else{p.vx=p.vy=0;}
 if(ball.state==='held'&&ball.owner===p){const tg=p.plan?p.plan.tgt:pickAim(p);if(tg)p.face=Math.atan2(tg.y-p.y,tg.x-p.x);}
}

// ---------- 업데이트 ----------
function updateFx(dt){
 for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.92;q.vy*=.92;q.life-=dt;}
 parts=parts.filter(q=>q.life>0);
 for(const t of texts){t.y-=30*dt;t.life-=dt*.9;}texts=texts.filter(t=>t.life>0);
 if(banner){banner.t-=dt;if(banner.t<=0)banner=null;}
 shake=Math.max(0,shake-dt*30);
}
function update(dt){
 if(state==='title'){
  if(P('arrowleft','a'))diffIdx=Math.max(0,diffIdx-1);
  if(P('arrowright','d'))diffIdx=Math.min(2,diffIdx+1);
  if(P('1'))diffIdx=0;if(P('2'))diffIdx=1;if(P('3'))diffIdx=2;
  if(Math.random()<.6)flame(rand(0,W),H+5,true);
  if(P('enter',' ','j')){beep(660,.1);startGame();}
  updateFx(dt);return;
 }
 if(state==='over'){overT+=dt;updateFx(dt);for(const p of players)if(!p.alive)p.fade-=dt;
  if(overT>1.2&&P('enter',' ','j'))state='title';return;}
 if(slow>0){slow-=dt;dt*=.35;}
 updateFx(dt);
 if(state==='ready'){readyT-=dt;if(readyT<=0){state='play';showBanner('시작!','#ffd23f',.8);beep(990,.2);}placeHeld();return;}
 stats.time+=dt;
 controlled=pickControlled();
 for(const p of players){
  p.stun=Math.max(0,p.stun-dt);p.inv=Math.max(0,p.inv-dt);p.catchT=Math.max(0,p.catchT-dt);p.catchCd=Math.max(0,p.catchCd-dt);
  p.throwAnim=Math.max(0,p.throwAnim-dt);p.catchAnim=Math.max(0,p.catchAnim-dt);
  if(!p.alive){p.fade-=dt*.8;continue;}
  p.x+=p.kx*dt;p.y+=p.ky*dt;const f=Math.pow(.004,dt);p.kx*=f;p.ky*=f;
  if(p===controlled)humanUpdate(p,dt);else aiUpdate(p,dt);
  bounds(p);
 }
 // 공
 if(ball.state==='held'){placeHeld();}
 else if(ball.state==='fly'){
  ball.t+=dt;
  if(ball.kind==='super'&&ball.target&&ball.target.alive){
   const s=Math.hypot(ball.vx,ball.vy),cur=Math.atan2(ball.vy,ball.vx),want=Math.atan2(ball.target.y-ball.y,ball.target.x-ball.x);
   const na=cur+clamp(angDiff(want,cur),-3.2*dt,3.2*dt);ball.vx=Math.cos(na)*s;ball.vy=Math.sin(na)*s;
  }
  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.spin+=dt*20;
  ball.trail.push({x:ball.x,y:ball.y});if(ball.trail.length>14)ball.trail.shift();
  if(ball.kind==='fire'){for(let i=0;i<3;i++)flame(ball.x,ball.y);}
  if(ball.kind==='super'){for(let i=0;i<6;i++)flame(ball.x,ball.y,true);}
  for(const p of players){
   if(!p.alive||ball.state!=='fly')continue;
   if(ball.kind==='pass'){if(p===ball.target&&dist(p,ball)<24){giveBall(p);beep(700,.06,'triangle');}continue;}
   if(p.team===ball.team||p.inv>0)continue;
   if(Math.hypot(p.x-ball.x,(p.y-8)-ball.y)<15+ball.r){if(tryCatch(p))catchBall(p);else hitPlayer(p);}
  }
  if(ball.state==='fly'&&(ball.x<CL-15||ball.x>CR+15||ball.y<CT-15||ball.y>CB+15)){
   ball.state='loose';
   if(ball.x<CL-15||ball.x>CR+15)ball.vx*=-.3;else ball.vx*=.3;
   if(ball.y<CT-15||ball.y>CB+15)ball.vy*=-.3;else ball.vy*=.3;
   ball.x=clamp(ball.x,CL-14,CR+14);ball.y=clamp(ball.y,CT-14,CB+14);beep(200,.06,'triangle',.05);
  }
 }else if(ball.state==='loose'){
  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;const f=Math.pow(.25,dt);ball.vx*=f;ball.vy*=f;ball.spin+=dt*Math.hypot(ball.vx,ball.vy)*.05;
  if(ball.x<CL+8){ball.x=CL+8;ball.vx=Math.abs(ball.vx)*.6;}if(ball.x>CR-8){ball.x=CR-8;ball.vx=-Math.abs(ball.vx)*.6;}
  if(ball.y<CT+10){ball.y=CT+10;ball.vy=Math.abs(ball.vy)*.6;}if(ball.y>CB-4){ball.y=CB-4;ball.vy=-Math.abs(ball.vy)*.6;}
  if(Math.abs(ball.x-MID)<16&&Math.hypot(ball.vx,ball.vy)<40)ball.vx+=(ball.x<MID?-1:1)*60*dt*10;
  for(const p of players){if(!p.alive||p.stun>0)continue;const mine=p.team===0?ball.x<MID:ball.x>=MID;
   if(mine&&Math.hypot(p.x-ball.x,p.y-ball.y)<24){giveBall(p);beep(520,.05,'triangle');break;}}
 }
 // 승패
 const a0=players.some(p=>p.team===0&&p.alive),a1=players.some(p=>p.team===1&&p.alive);
 if(!a0||!a1){winner=a0?0:1;state='over';overT=0;slow=0;
  if(winner===0){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.25,'square',.06),i*130));}
  else{[392,330,262].forEach((f,i)=>setTimeout(()=>beep(f,.35,'triangle',.07),i*200));}}
}
function placeHeld(){const o=ball.owner;if(!o)return;ball.x=o.x+Math.cos(o.face)*14;ball.y=o.y-8+Math.sin(o.face)*6;}

// ---------- 그리기 ----------
const floor=document.createElement('canvas');floor.width=W;floor.height=H;
(function(){
 const g=floor.getContext('2d');
 const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#1b1830');bg.addColorStop(1,'#120f20');g.fillStyle=bg;g.fillRect(0,0,W,H);
 // 바닥
 const fl=g.createLinearGradient(0,CT-30,0,CB+30);fl.addColorStop(0,'#c98e4f');fl.addColorStop(1,'#a8703a');
 g.fillStyle=fl;g.fillRect(CL-30,CT-26,CR-CL+60,CB-CT+50);
 g.strokeStyle='rgba(90,50,20,.25)';g.lineWidth=1;
 for(let y=CT-26;y<CB+24;y+=14){g.beginPath();g.moveTo(CL-30,y);g.lineTo(CR+30,y);g.stroke();
  for(let x=CL-30+((y/14|0)%3)*40;x<CR+30;x+=120){g.beginPath();g.moveTo(x,y);g.lineTo(x,y+14);g.stroke();}}
 g.fillStyle='rgba(58,123,234,.12)';g.fillRect(CL,CT,MID-CL,CB-CT);
 g.fillStyle='rgba(224,70,70,.12)';g.fillRect(MID,CT,CR-MID,CB-CT);
 g.strokeStyle='#fff';g.lineWidth=4;g.strokeRect(CL,CT,CR-CL,CB-CT);
 g.beginPath();g.moveTo(MID,CT);g.lineTo(MID,CB);g.stroke();
 g.lineWidth=2;g.beginPath();g.arc(MID,(CT+CB)/2,50,0,Math.PI*2);g.stroke();
 g.globalAlpha=.08;g.fillStyle='#fff';g.font='bold 90px sans-serif';g.textAlign='center';g.textBaseline='middle';
 g.fillText('🔥',MID,(CT+CB)/2);g.globalAlpha=1;
})();

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawPlayer(p){
 if(!p.alive&&p.fade<=0)return;
 ctx.save();ctx.globalAlpha=p.alive?1:Math.max(0,p.fade);
 const moving=Math.hypot(p.vx,p.vy)>10,bob=moving?Math.sin(T*16+p.idx)*2:0;
 const x=p.x,y=p.y;
 ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x,y+12,16,6,0,0,Math.PI*2);ctx.fill();
 if(p===controlled&&p.alive){ctx.strokeStyle='#ffe14d';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y+12,20,8,0,0,Math.PI*2);ctx.stroke();}
 const flash=p.inv>0&&Math.floor(T*20)%2===0;
 // 다리
 ctx.fillStyle='#2b2b3a';const lg=moving?Math.sin(T*16+p.idx)*4:0;
 ctx.fillRect(x-7,y+2,5,10+lg*.5);ctx.fillRect(x+2,y+2,5,10-lg*.5);
 // 몸
 ctx.fillStyle=flash?'#fff':TEAM_COL[p.team];rr(x-11,y-16+bob,22,20,6);ctx.fill();
 ctx.fillStyle=TEAM_DARK[p.team];ctx.fillRect(x-11,y-2+bob,22,5);
 ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.idx===0?'★':p.idx+1,x,y-8+bob);
 // 팔
 ctx.strokeStyle='#f6d2a8';ctx.lineWidth=4;ctx.lineCap='round';
 const catching=p.catchAnim>0,dir=Math.cos(p.face)>=0?1:-1;
 ctx.beginPath();
 if(catching){ctx.moveTo(x-9,y-12+bob);ctx.lineTo(x+dir*16,y-14+bob);ctx.moveTo(x+9,y-12+bob);ctx.lineTo(x+dir*16,y-6+bob);}
 else if(p.throwAnim>0){ctx.moveTo(x+dir*9,y-12+bob);ctx.lineTo(x+dir*22,y-14+bob);ctx.moveTo(x-dir*9,y-12+bob);ctx.lineTo(x-dir*14,y-2+bob);}
 else if(p.charging){ctx.moveTo(x+dir*9,y-12+bob);ctx.lineTo(x-dir*12,y-24+bob);ctx.moveTo(x-dir*9,y-12+bob);ctx.lineTo(x-dir*14,y-2+bob);}
 else{ctx.moveTo(x-10,y-12+bob);ctx.lineTo(x-13,y+1+bob);ctx.moveTo(x+10,y-12+bob);ctx.lineTo(x+13,y+1+bob);}
 ctx.stroke();
 // 머리
 ctx.fillStyle=flash?'#fff':'#f6d2a8';ctx.beginPath();ctx.arc(x,y-25+bob,10,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=p.hair;ctx.beginPath();ctx.arc(x,y-28+bob,10,Math.PI*1.05,Math.PI*1.95);ctx.fill();
 if(p.idx===0){ctx.beginPath();ctx.moveTo(x-8,y-33+bob);ctx.lineTo(x-2,y-42+bob);ctx.lineTo(x+1,y-34+bob);ctx.lineTo(x+7,y-41+bob);ctx.lineTo(x+9,y-31+bob);ctx.fill();}
 ctx.fillStyle='#ff4040';ctx.fillRect(x-10,y-31+bob,20,3);// 머리띠
 ctx.fillStyle='#222';const ex=Math.cos(p.face)*3;
 if(!p.alive){ctx.font='bold 9px sans-serif';ctx.fillText('x  x',x+ex,y-24);}
 else if(p.stun>0){ctx.font='bold 9px sans-serif';ctx.fillText('> <',x+ex,y-24+bob);}
 else{ctx.fillRect(x-4+ex,y-26+bob,2,3);ctx.fillRect(x+2+ex,y-26+bob,2,3);}
 // 기 모으기 링
 if(p.charging&&p.alive){const c=Math.min(1,p.charge/FIRE_T);ctx.strokeStyle=c>=1?'#ff6a00':'#ffe14d';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(x,y-8,26,-Math.PI/2,-Math.PI/2+Math.PI*2*c);ctx.stroke();}
 // HP 바
 if(p.alive){const w=34,hp=p.hp/p.maxHp;ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(x-w/2,y-50,w,5);
  ctx.fillStyle=hp>.5?'#5be36a':hp>.25?'#ffd23f':'#ff4d4d';ctx.fillRect(x-w/2,y-50,w*hp,5);
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='10px sans-serif';ctx.fillText(p.name,x,y-58);}
 if(p===controlled&&p.alive){ctx.fillStyle='#ffe14d';ctx.beginPath();const ty=y-72+Math.sin(T*6)*3;ctx.moveTo(x-6,ty);ctx.lineTo(x+6,ty);ctx.lineTo(x,ty+8);ctx.fill();}
 ctx.restore();
}
function drawBall(){
 if(ball.state==='held'&&!ball.owner)return;
 const b=ball;
 if(b.state==='fly'&&b.kind!=='pass'){
  for(let i=0;i<b.trail.length;i++){const t=b.trail[i],a=i/b.trail.length;
   ctx.fillStyle=b.kind==='normal'?`rgba(255,255,255,${a*.25})`:`rgba(255,${120+a*100|0},0,${a*.5})`;
   ctx.beginPath();ctx.arc(t.x,t.y,b.r*a,0,Math.PI*2);ctx.fill();}
 }
 ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(b.x,b.y+16,b.r,b.r*.4,0,0,Math.PI*2);ctx.fill();
 if(b.state==='fly'&&(b.kind==='fire'||b.kind==='super')){
  const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*2.6);g.addColorStop(0,'rgba(255,240,150,.9)');g.addColorStop(.4,'rgba(255,120,0,.6)');g.addColorStop(1,'rgba(255,40,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r*2.6,0,Math.PI*2);ctx.fill();
 }
 ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.spin);
 ctx.fillStyle=b.state==='fly'&&b.kind==='super'?'#fff4b0':b.state==='fly'&&b.kind==='fire'?'#ffd27a':'#f4f4f4';
 ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#d33';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,b.r*.6,-.8,.8);ctx.stroke();ctx.beginPath();ctx.arc(0,0,b.r*.6,Math.PI-.8,Math.PI+.8);ctx.stroke();
 ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);ctx.stroke();
 ctx.restore();
}
function drawAimMarker(){
 const p=controlled;if(!p||ball.state!=='held'||ball.owner!==p||!p.aim)return;
 const e=p.aim;ctx.save();ctx.strokeStyle=p.fireReady?'#ff6a00':'#ffe14d';ctx.lineWidth=2;ctx.setLineDash([6,5]);
 ctx.beginPath();ctx.moveTo(p.x,p.y-8);ctx.lineTo(e.x,e.y-8);ctx.globalAlpha=.4;ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
 const r=20+Math.sin(T*8)*2;ctx.beginPath();ctx.arc(e.x,e.y-8,r,0,Math.PI*2);ctx.stroke();
 for(let i=0;i<4;i++){const a=i*Math.PI/2+T;ctx.beginPath();ctx.moveTo(e.x+Math.cos(a)*(r-5),e.y-8+Math.sin(a)*(r-5));ctx.lineTo(e.x+Math.cos(a)*(r+5),e.y-8+Math.sin(a)*(r+5));ctx.stroke();}
 ctx.restore();
 if(p.holdT>3){ctx.fillStyle='#ffb347';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText(Math.ceil(6-p.holdT)+'',p.x,p.y-84);}
}
function drawHUD(){
 ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,W,78);
 for(let t=0;t<2;t++){
  const left=t===0,x0=left?20:W-20;ctx.textAlign=left?'left':'right';
  ctx.fillStyle=TEAM_COL[t];ctx.font='bold 20px "Malgun Gothic",sans-serif';ctx.fillText(TEAM_NAME[t]+(t===0?' (YOU)':' (CPU)'),x0,28);
  // 생존자 아이콘
  const team=players.filter(p=>p.team===t);
  team.forEach((p,i)=>{const cx=left?x0+10+i*26:x0-10-i*26;ctx.globalAlpha=p.alive?1:.25;ctx.fillStyle=TEAM_COL[t];
   ctx.beginPath();ctx.arc(cx,46,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText(p.idx===0?'★':p.idx+1,cx,50);ctx.globalAlpha=1;});
  // 게이지
  ctx.textAlign=left?'left':'right';
  const gw=200,gx=left?x0:x0-gw,gy=60,full=gauge[t]>=100;
  ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(gx,gy,gw,10);
  const gg=ctx.createLinearGradient(gx,0,gx+gw,0);gg.addColorStop(0,'#ffd23f');gg.addColorStop(1,'#ff3c00');
  ctx.fillStyle=full&&Math.floor(T*6)%2?'#fff':gg;const fw=gw*gauge[t]/100;ctx.fillRect(left?gx:gx+gw-fw,gy,fw,10);
  ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign=left?'left':'right';
  ctx.fillText(full?(t===0?'필살 MAX! [L]':'필살 MAX!'):'필살 게이지',left?gx+gw+8:gx-8,gy+9);
 }
 ctx.textAlign='center';ctx.fillStyle='#ffd23f';ctx.font='bold 18px sans-serif';ctx.fillText('VS',W/2,30);
 ctx.fillStyle='#aaa';ctx.font='12px sans-serif';ctx.fillText('난이도: '+diff.name,W/2,50);
 ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='12px "Malgun Gothic",sans-serif';
 ctx.fillText('이동: 방향키/WASD   던지기: J/Space (길게 눌러 불꽃 슛)   잡기·패스: K (공 없을 땐 J/Space도 잡기)   필살 슛: L',W/2,H-12);
}
function drawFx(){
 for(const q of parts){ctx.globalAlpha=Math.max(0,q.life/q.max);ctx.fillStyle=q.col;
  if(q.fire)ctx.globalCompositeOperation='lighter';ctx.beginPath();ctx.arc(q.x,q.y,q.size*(q.fire?q.life/q.max+.3:1),0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='source-over';}
 ctx.globalAlpha=1;
 for(const t of texts){ctx.globalAlpha=Math.min(1,t.life*2);ctx.font=`bold ${t.size}px "Malgun Gothic",sans-serif`;ctx.textAlign='center';
  ctx.strokeStyle='#000';ctx.lineWidth=4;ctx.strokeText(t.txt,t.x,t.y);ctx.fillStyle=t.col;ctx.fillText(t.txt,t.x,t.y);}
 ctx.globalAlpha=1;
}
function drawBanner(){
 if(!banner)return;const k=banner.t/banner.max,sc=1+Math.max(0,(k-.8))*3;
 ctx.save();ctx.translate(W/2,H/2-20);ctx.scale(sc,sc);ctx.globalAlpha=Math.min(1,k*3);
 ctx.font='bold 54px "Malgun Gothic",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.lineWidth=8;ctx.strokeStyle='#000';ctx.strokeText(banner.txt,0,0);ctx.fillStyle=banner.col;ctx.fillText(banner.txt,0,0);ctx.restore();
}
function fireText(txt,x,y,size){
 ctx.save();ctx.font=`900 ${size}px "Malgun Gothic",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
 const g=ctx.createLinearGradient(0,y-size/2,0,y+size/2);g.addColorStop(0,'#fff6a0');g.addColorStop(.5,'#ff9d1f');g.addColorStop(1,'#e0200b');
 ctx.lineWidth=10;ctx.strokeStyle='#2a0800';ctx.strokeText(txt,x,y);ctx.fillStyle=g;ctx.fillText(txt,x,y);ctx.restore();
}
function drawTitle(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a0f2e');g.addColorStop(1,'#3a0d0d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 drawFx();
 fireText('불꽃 피구왕',W/2,140+Math.sin(T*2)*4,92);
 ctx.fillStyle='#ffd9a0';ctx.font='18px "Malgun Gothic",sans-serif';ctx.textAlign='center';ctx.fillText('불꽃 슛으로 상대 팀을 모두 아웃시켜라!',W/2,210);
 // 공 애니메이션
 const bx=W/2+Math.sin(T*1.5)*180,by=275-Math.abs(Math.sin(T*4))*30;
 for(let i=0;i<2;i++)flame(bx,by);ctx.fillStyle='#ffd27a';ctx.beginPath();ctx.arc(bx,by,12,0,Math.PI*2);ctx.fill();
 ctx.font='bold 20px "Malgun Gothic",sans-serif';ctx.fillStyle='#fff';ctx.fillText('난이도 선택 (← →)',W/2,335);
 DIFFS.forEach((d,i)=>{const x=W/2+(i-1)*150,sel=i===diffIdx;ctx.fillStyle=sel?'#ff7a1a':'rgba(255,255,255,.1)';rr(x-60,352,120,40,10);ctx.fill();
  if(sel){ctx.strokeStyle='#ffe14d';ctx.lineWidth=2;ctx.stroke();}ctx.fillStyle='#fff';ctx.font='bold 18px "Malgun Gothic",sans-serif';ctx.fillText(d.name,x,378);});
 ctx.fillStyle='rgba(255,255,255,.75)';ctx.font='14px "Malgun Gothic",sans-serif';
 ['이동: 방향키 / WASD    던지기: J 또는 Space    잡기·패스: K    필살 슛: L',
  'J를 길게 눌렀다 떼면 🔥불꽃 슛! 불꽃 슛은 맞기 직전 정확한 타이밍에 K를 눌러야 잡힘',
  '공을 맞히거나 잡으면 필살 게이지가 차오르고, 가득 차면 잡을 수 없는 태양 슛 발동'].forEach((s,i)=>ctx.fillText(s,W/2,428+i*22));
 ctx.globalAlpha=.6+Math.sin(T*5)*.4;ctx.fillStyle='#ffe14d';ctx.font='bold 22px "Malgun Gothic",sans-serif';ctx.fillText('ENTER 또는 SPACE로 시작',W/2,512);ctx.globalAlpha=1;
}
function draw(){
 if(state==='title'){drawTitle();return;}
 ctx.save();
 if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));
 ctx.drawImage(floor,0,0);
 const list=[...players].sort((a,b)=>a.y-b.y);
 const drawn=new Set();
 for(const p of list){
  if(ball.y+8<p.y&&!drawn.has('b')){drawBall();drawn.add('b');}
  drawPlayer(p);
 }
 if(!drawn.has('b'))drawBall();
 drawAimMarker();drawFx();
 ctx.restore();
 drawHUD();drawBanner();
 if(state==='over'){
  ctx.fillStyle=`rgba(0,0,0,${Math.min(.65,overT)})`;ctx.fillRect(0,0,W,H);
  if(overT>.4){
   if(winner===0)fireText('승리!!',W/2,190,100);else{ctx.font='900 90px "Malgun Gothic",sans-serif';ctx.textAlign='center';ctx.fillStyle='#8aa0c8';ctx.fillText('패배...',W/2,190);}
   ctx.fillStyle='#fff';ctx.font='18px "Malgun Gothic",sans-serif';ctx.textAlign='center';
   const m=Math.floor(stats.time/60),s=Math.floor(stats.time%60);
   ctx.fillText(`경기 시간 ${m}:${String(s).padStart(2,'0')}   명중 ${stats.hits[0]}회   캐치 ${stats.catches[0]}회   불꽃·필살 슛 ${stats.fires[0]}회`,W/2,280);
   ctx.fillText(`남은 선수 : ${players.filter(p=>p.team===0&&p.alive).length} vs ${players.filter(p=>p.team===1&&p.alive).length}`,W/2,310);
   if(overT>1.2){ctx.globalAlpha=.6+Math.sin(T*5)*.4;ctx.fillStyle='#ffe14d';ctx.font='bold 20px "Malgun Gothic",sans-serif';ctx.fillText('ENTER로 타이틀로',W/2,370);ctx.globalAlpha=1;}
  }
 }
}

// ---------- 루프 ----------
let last=performance.now();
function loop(now){
 const dt=Math.min(.033,(now-last)/1000);last=now;T+=dt;
 update(dt);draw();
 for(const k in pressed)delete pressed[k];for(const k in released)delete released[k];
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

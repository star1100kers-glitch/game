   const cur=Math.atan2(b.dirz,b.dirx),want=Math.atan2(b.target.z-b.bz,b.target.x-b.bx);

  let off=0,yo=0;

  if(key==='spiral'){off=Math.sin(b.t*16)*.55;yo=Math.cos(b.t*16)*.45;}

 }
}

function fireText(txt,x,y,size){
 ctx.save();ctx.font=`900 ${size}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
 const g=ctx.createLinearGradient(0,y-size/2,0,y+size/2);g.addColorStop(0,'#fff6a0');g.addColorStop(.5,'#ff9d1f');g.addColorStop(1,'#e0200b');
 ctx.lineWidth=12;ctx.strokeStyle='#2a0800';ctx.lineJoin='round';ctx.strokeText(txt,x,y);ctx.fillStyle=g;ctx.fillText(txt,x,y);ctx.restore();
}
function portrait(p,x,y,r){
 ctx.save();ctx.globalAlpha=p.alive?1:.35;
 ctx.fillStyle=css(TEAM_COL[p.team]);ctx.beginPath();ctx.arc(x,y,r+2,0,PI*2);ctx.fill();
 ctx.fillStyle='#ffd8b8';ctx.beginPath();ctx.arc(x,y+2,r*.8,0,PI*2);ctx.fill();
 const hc=css(p.def.hairCol);
 if(p.def.hair==='mohawk'){ctx.fillStyle=hc;ctx.fillRect(x-2,y-r,4,r*.8);}
 else if(p.def.hair==='hood'){ctx.strokeStyle=hc;ctx.lineWidth=5;ctx.beginPath();ctx.arc(x,y+2,r*.85,PI*.8,PI*2.2);ctx.stroke();ctx.fillStyle='#1a1a22';ctx.fillRect(x-r*.7,y+4,r*1.4,r*.45);}
 else{ctx.fillStyle=hc;ctx.beginPath();ctx.arc(x,y,r*.85,PI*1.05,PI*1.95);ctx.fill();}
 ctx.fillStyle=css(p.def.eye);ctx.fillRect(x-r*.4-1,y,3,4);ctx.fillRect(x+r*.4-2,y,3,4);
 if(!p.alive){ctx.globalAlpha=1;ctx.strokeStyle='#ff3030';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-r,y-r);ctx.lineTo(x+r,y+r);ctx.moveTo(x+r,y-r);ctx.lineTo(x-r,y+r);ctx.stroke();}
 ctx.restore();
}
function drawCards(){
 for(let t=0;t<2;t++){const team=players.filter(p=>p.team===t);
  team.forEach((p,i)=>{
   const x=t===0?6+i*110:W-6-(4-i)*110,y=6,w=106,h=54;
   ctx.fillStyle=p===controlled&&p.alive?'rgba(255,225,77,.25)':'rgba(0,0,0,.5)';rr(x,y,w,h,8);ctx.fill();
   if(p===controlled&&p.alive){ctx.strokeStyle='#ffe14d';ctx.lineWidth=2;ctx.stroke();}
   portrait(p,x+19,y+22,14);
   ctx.textAlign='left';ctx.fillStyle=p.alive?'#fff':'#777';ctx.font=`bold 12px ${FONT}`;ctx.fillText(p.name,x+38,y+16);
   ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(x+38,y+22,62,6);
   const hp=p.hp/p.maxHp;ctx.fillStyle=hp>.5?'#5be36a':hp>.25?'#ffd23f':'#ff4d4d';ctx.fillRect(x+38,y+22,62*hp,6);
   ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(x+38,y+32,62,5);
   const full=p.gauge>=100&&p.alive;
   const g=ctx.createLinearGradient(x+38,0,x+100,0);g.addColorStop(0,'#ffd23f');g.addColorStop(1,p.def.sp.col);
   ctx.fillStyle=full&&Math.floor(T*8)%2?'#fff':g;ctx.fillRect(x+38,y+32,62*p.gauge/100,5);
   ctx.font=`bold 9px ${FONT}`;ctx.fillStyle=full?p.def.sp.col:'#aaa';ctx.fillText(full?'필살 MAX!':p.def.sp.name,x+38,y+49);
  });}
 ctx.textAlign='center';outlined('VS',W/2,30,20,'#ffd23f');ctx.fillStyle='#bbb';ctx.font=`11px ${FONT}`;ctx.fillText(diff.name,W/2,48);
}
function drawWorldUI(){
 for(const p of players){if(!p.alive)continue;const s=p.def.scale;
  const q=proj(p.x,p.y+2.75*s,p.z);if(!q.ok)continue;
  const w=40,hp=p.hp/p.maxHp;ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(q.x-w/2-1,q.y-1,w+2,6);
  ctx.fillStyle=hp>.5?'#5be36a':hp>.25?'#ffd23f':'#ff4d4d';ctx.fillRect(q.x-w/2,q.y,w*hp,4);
  if(p.gauge>=100){ctx.fillStyle=p.def.sp.col;ctx.fillRect(q.x-w/2,q.y+5,w,2);}
  ctx.textAlign='center';ctx.font=`bold 11px ${FONT}`;ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.8)';ctx.strokeText(p.name,q.x,q.y-4);
  ctx.fillStyle=p.team===0?'#bcd4ff':'#ffc0c8';ctx.fillText(p.name,q.x,q.y-4);
  if(p===controlled){const yy=q.y-30+Math.sin(T*6)*3;ctx.fillStyle='#ffe14d';ctx.beginPath();ctx.moveTo(q.x-8,yy);ctx.lineTo(q.x+8,yy);ctx.lineTo(q.x,yy+10);ctx.fill();}
  if(p.charging&&p.team===0){const c=proj(p.x,p.y+1.1*s,p.z),k=Math.min(1,p.charge/.75);ctx.strokeStyle=k>=1?'#ff6a00':'#ffe14d';ctx.lineWidth=4;
   ctx.beginPath();ctx.arc(c.x,c.y,34,-PI/2,-PI/2+PI*2*k);ctx.stroke();}
  if(p===controlled&&ball.state==='held'&&ball.owner===p&&p.holdT>3){outlined(String(Math.ceil(6-p.holdT)),q.x,q.y-40,18,'#ffb347');}
  if(p.frozen>0){outlined('빙결',q.x,q.y-20,14,'#7fe8ff','bold',3);}
 }
 for(const t of texts){const q=proj(t.x,t.y,t.z);if(!q.ok)continue;ctx.globalAlpha=Math.min(1,t.life*2);ctx.textAlign='center';outlined(t.txt,q.x,q.y,t.size,t.col);}
 ctx.globalAlpha=1;
}
function drawBottom(){
 ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,H-26,W,26);
 ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.8)';ctx.font=`12px ${FONT}`;
 ctx.fillText('이동: 방향키/WASD   던지기: J/Space (길게 = 불꽃 슛)   잡기·패스: K   필살기: L (개인 게이지 MAX)',W/2,H-9);
 const p=controlled;
 if(p&&p.alive&&ball.state==='held'&&ball.owner===p&&state==='play'){
  const full=p.gauge>=100;ctx.globalAlpha=full?.7+Math.sin(T*8)*.3:.85;
  outlined(full?`★ [L] 필살기 「${p.def.sp.name}」 발동 가능! ★`:`필살기 「${p.def.sp.name}」 게이지 ${p.gauge|0}%`,W/2,H-40,full?20:14,full?p.def.sp.col:'#ccc');ctx.globalAlpha=1;}
}
function drawBanner(){
 if(!banner)return;const k=banner.t/banner.max,sc=1+Math.max(0,k-.8)*3;
 ctx.save();ctx.translate(W/2,H/2-30);ctx.scale(sc,sc);ctx.globalAlpha=Math.min(1,k*3);ctx.textAlign='center';ctx.textBaseline='middle';
 outlined(banner.txt,0,0,58,banner.col,'900',10);ctx.restore();
}
function drawCutin(){
 const p=cut.p,d=p.def,k=cut.t/cut.dur,col=d.sp.col,dir=p.team===0?1:-1;
 ctx.save();ctx.globalAlpha=.55;ctx.strokeStyle='#fff';
 for(let i=0;i<46;i++){const a=(i/46)*PI*2+Math.sin(i*91+Math.floor(T*20))*.05,r0=230+((i*37+Math.floor(T*30)*13)%90),r1=r0+200+(i*53%200);
  ctx.lineWidth=1+(i%3);ctx.beginPath();ctx.moveTo(W/2+Math.cos(a)*r0,H/2+Math.sin(a)*r0*.7);ctx.lineTo(W/2+Math.cos(a)*r1,H/2+Math.sin(a)*r1*.7);ctx.stroke();}
 ctx.restore();
 const bar=ease(k*4)*64;ctx.fillStyle='#000';ctx.fillRect(0,0,W,bar);ctx.fillRect(0,H-bar,W,bar);
 const slide=(1-ease((k-.08)*5))*W*1.3*dir;
 ctx.save();ctx.translate(W/2-slide,H*.74);ctx.rotate(-.07*dir);
 const g=ctx.createLinearGradient(-W/2,0,W/2,0);g.addColorStop(0,'rgba(0,0,0,.9)');g.addColorStop(.5,col);g.addColorStop(1,'rgba(0,0,0,.9)');
 ctx.fillStyle=g;ctx.fillRect(-W,-50,W*2,100);ctx.fillStyle='#fff';ctx.fillRect(-W,-54,W*2,4);ctx.fillRect(-W,50,W*2,4);
 ctx.textAlign='center';ctx.textBaseline='middle';
 outlined(`${TEAM_NAME[p.team]} · ${d.role} ${d.name}`,0,-30,15,'#fff','bold',4);
 const sc=1+Math.max(0,.35-k)*.6;ctx.scale(sc,sc);
 outlined(`필살 「${d.sp.name}」`,0,10,46,'#fff','900',10);
 ctx.restore();
 if(k>.22){const a=Math.min(1,(k-.22)*6);ctx.save();ctx.globalAlpha=a;
  const bx=p.team===0?70:W-70-420;ctx.fillStyle='rgba(255,255,255,.95)';rr(bx,84,420,58,14);ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.stroke();
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#111';ctx.font=`900 24px ${FONT}`;ctx.fillText(`「${d.sp.cry}」`,bx+210,113);ctx.restore();}
 if(k>.88){ctx.fillStyle=`rgba(255,255,255,${(k-.88)*8*.85})`;ctx.fillRect(0,0,W,H);}
}
function drawTitle(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(10,6,20,.55)');g.addColorStop(.5,'rgba(10,6,20,.3)');g.addColorStop(1,'rgba(10,6,20,.85)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 fireText('불꽃 피구왕 3D',W/2,74+Math.sin(T*2)*4,72);
 ctx.textAlign='center';outlined('8명의 선수, 8개의 필살기! 상대 팀을 모두 아웃시켜라!',W/2,134,17,'#ffd9a0','bold',4);
 for(let t=0;t<2;t++){const x0=t===0?30:W/2+10;
  ctx.fillStyle='rgba(0,0,0,.6)';rr(x0,152,W/2-40,210,12);ctx.fill();
  ctx.textAlign='left';outlined(TEAM_NAME[t]+(t===0?' (YOU)':' (CPU)'),x0+14,176,16,t===0?'#7fb0ff':'#ff7f8a','bold',4);
  players.filter(p=>p.team===t).forEach((p,i)=>{const y=204+i*40;portrait(p,x0+28,y+2,13);
   ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font=`bold 13px ${FONT}`;ctx.fillText(p.name,x0+50,y);ctx.fillStyle='#aaa';ctx.font=`11px ${FONT}`;ctx.fillText(p.def.role,x0+50,y+15);
   ctx.fillStyle=p.def.sp.col;ctx.font=`bold 13px ${FONT}`;ctx.fillText(p.def.sp.name,x0+170,y);ctx.fillStyle='#ccc';ctx.font=`11px ${FONT}`;ctx.fillText(p.def.sp.desc,x0+170,y+15);});}
 ctx.textAlign='center';outlined('난이도 (← →)',W/2,392,16,'#fff','bold',4);
 DIFFS.forEach((d,i)=>{const x=W/2+(i-1)*140,sel=i===diffIdx;ctx.fillStyle=sel?'#ff7a1a':'rgba(0,0,0,.6)';rr(x-58,404,116,36,10);ctx.fill();
  if(sel){ctx.strokeStyle='#ffe14d';ctx.lineWidth=2;ctx.stroke();}ctx.fillStyle='#fff';ctx.font=`bold 17px ${FONT}`;ctx.textBaseline='middle';ctx.fillText(d.name,x,422);ctx.textBaseline='alphabetic';});
 ctx.fillStyle='rgba(255,255,255,.85)';ctx.font=`13px ${FONT}`;
 ctx.fillText('이동 WASD/방향키 · 던지기 J/Space(길게=불꽃 슛) · 잡기/패스 K · 필살기 L — 맞히거나 잡으면 개인 필살 게이지 상승',W/2,466);
 ctx.globalAlpha=.6+Math.sin(T*5)*.4;outlined('ENTER 또는 SPACE로 시작',W/2,505,22,'#ffe14d','bold',5);ctx.globalAlpha=1;
}
function drawOver(){
 ctx.fillStyle=`rgba(0,0,0,${Math.min(.35,overT*.5)})`;ctx.fillRect(0,0,W,H);
 if(overT<.4)return;
 if(winner===0)fireText('승리!!',W/2,120,110);else{ctx.textAlign='center';outlined('패배...',W/2,140,96,'#8aa0c8','900',10);}
 const m=Math.floor(stats.time/60),s=Math.floor(stats.time%60);ctx.textAlign='center';
 outlined(`경기 시간 ${m}:${String(s).padStart(2,'0')}   명중 ${stats.hits[0]}회   캐치 ${stats.catches[0]}회   필살기 ${stats.specials[0]}회`,W/2,H-110,18,'#fff','bold',4);
 if(overT>1.5){ctx.globalAlpha=.6+Math.sin(T*5)*.4;outlined('ENTER로 타이틀로',W/2,H-60,22,'#ffe14d','bold',5);ctx.globalAlpha=1;}
}
function drawHUD(){
 ctx.setTransform(hs,0,0,hs,0,0);ctx.clearRect(0,0,W,H);ctx.textBaseline='alphabetic';
 if(state==='title'){drawTitle();return;}
 if(state==='cutin'){drawCutin();return;}
 drawWorldUI();drawCards();drawBottom();drawBanner();
 if(state==='over')drawOver();
}

// ================= 루프 =================
let last=performance.now();
function loop(now){
 const dt=Math.min(.033,(now-last)/1000);last=now;T+=dt;
 update(dt);
 const adt=hitstop>0?0:dt*(slow>0?.35:1);
 updateFx(hitstop>0?dt*.15:dt);
 for(const p of players)animChar(p,adt);
 syncBall(adt);syncMarkers();updateCrowd();updateCamera(dt);
 renderer.render(scene,camera);drawHUD();
 for(const k in pressed)delete pressed[k];for(const k in released)delete released[k];
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
